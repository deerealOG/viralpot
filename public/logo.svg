<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />
  
  <!-- Stylized Pot / V Shape -->
  <path d="M140 180 L256 380 L372 180" fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Rim of the pot -->
  <line x1="120" y1="180" x2="392" y2="180" stroke="white" stroke-width="40" stroke-linecap="round" />
  
  <!-- Bubbles / Sparks representing viral energy -->
  <circle cx="256" cy="120" r="30" fill="#0D9488" />
  <circle cx="340" cy="100" r="20" fill="#0D9488" opacity="0.8" />
  <circle cx="170" cy="100" r="20" fill="#0D9488" opacity="0.8" />
  
  <!-- Sparkle accent -->
  <path d="M420 100 L430 80 L440 100 L460 110 L440 120 L430 140 L420 120 L400 110 Z" fill="#FFFFFF" />
</svg>
